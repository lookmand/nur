    <stop offset="1" stop-color="#15251f"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#d9c8aa" stop-opacity=".22"/><stop offset="1" stop-color="#d9c8aa" stop-opacity="0"/></radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#30483a"/><stop offset="1" stop-color="#14231e"/>
  </linearGradient>
</defs>
